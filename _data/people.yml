# Students supervised by Quentin Bouniot — rendered on /people/
#
# Each entry goes in one of three categories: phd, intern, project
# and in either the `current` or the `previous` list.
#
# Fields (all optional except name and category):
#   name:      Full name
#   category:  phd | intern | project
#   type:      Short label shown above the topic, e.g. "MSc thesis", "BSc thesis",
#              "Research internship", "PRIM project" (free text)
#   period:    e.g. "2026 – present" or "Spring 2025"
#   topic:     Thesis / internship / project topic
#   cosup:     Co-supervisors, e.g. "Florence d'Alché-Buc, Stefanie Jegelka"
#   photo:     (current PhD students only) File name inside /images/people/ (e.g. jane-doe.jpg).
#              Square images look best. If omitted, a placeholder with initials is shown.
#              Other students are shown without any photo block.
#   website:   Personal page URL
#   scholar:   Google Scholar URL
#   github:    GitHub URL
#   linkedin:  LinkedIn URL
#   now:       (previous students only) Where they went afterwards, e.g. "PhD at Inria"

